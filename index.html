<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PhoneXpress Premium</title>

<style>
:root {
  --white: #f7fbff;
  --muted: rgba(247, 251, 255, .6);
  --panel: rgba(8, 14, 28, .5);
  --line: rgba(190, 215, 255, .1);
  --green: #42f3a0;
  --accent: #83aaff; /* Mis à jour par JS */
  --transition-speed: 0.8s;
  --transition-cubic: cubic-bezier(0.19, 1, 0.22, 1);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: var(--white);
  background: transparent;
  min-height: 100vh;
  overflow-x: hidden;
}

.px-showcase {
  position: relative;
  width: 100%;
  max-width: 1250px;
  margin: auto;
  padding: 40px 20px;
  isolation: isolate;
}

/* Aura de fond */
.px-showcase::before {
  content: "";
  position: absolute;
  top: 15%; left: 50%;
  width: 600px; height: 450px;
  transform: translateX(-50%);
  background: radial-gradient(circle, var(--accent), transparent 70%);
  opacity: 0.15;
  filter: blur(60px);
  z-index: -1;
  transition: background 0.8s;
}

/* Carousel Stage */
.device-stage {
  position: relative;
  height: 400px;
  perspective: 2000px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.device-slide {
  position: absolute;
  width: 180px; height: 360px;
  transition: all var(--transition-speed) var(--transition-cubic), opacity 0.6s ease;
  cursor: pointer;
  opacity: 0;
  transform: translateZ(-500px);
  will-change: transform, opacity;
}

.device-slide[data-pos="0"] { opacity: 1; z-index: 10; width: 440px; transform: translateZ(200px); }
.device-slide[data-pos="-1"] { opacity: 0.35; z-index: 5; transform: translateX(-320px) rotateY(45deg) scale(0.8); filter: blur(2px); }
.device-slide[data-pos="1"] { opacity: 0.35; z-index: 5; transform: translateX(320px) rotateY(-45deg) scale(0.8); filter: blur(2px); }

.duo { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
.phone { position: absolute; transition: var(--transition-speed) var(--transition-cubic); filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4)); }
.device-slide[data-pos="0"] .phone.front { transform: translateX(45px) rotateY(-10deg); }
.device-slide[data-pos="0"] .phone.back { transform: translateX(215px) rotateY(15deg); opacity: 1; }
.device-slide:not([data-pos="0"]) .phone.back { opacity: 0; }
.phone img, .phone svg { width: 160px; height: auto; display: block; }

/* Navigation */
.nav-arrow {
  position: absolute; top: 180px; z-index: 30;
  width: 54px; height: 54px; border-radius: 50%;
  background: rgba(255,255,255,0.03); border: 1px solid var(--line);
  color: white; backdrop-filter: blur(10px); cursor: pointer;
  transition: 0.3s; font-size: 24px;
}
.nav-arrow:hover { background: var(--accent); color: #000; transform: scale(1.1); }
.nav-arrow.prev { left: 5%; }
.nav-arrow.next { right: 5%; }

/* Contenu */
.content-grid {
  display: grid;
  grid-template-columns: 280px 1fr 280px;
  gap: 30px; margin-top: 20px; align-items: start;
}

.glass-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 24px; padding: 24px; backdrop-filter: blur(15px);
}

.main-copy { text-align: center; }
h1 { font-size: 3.2rem; margin: 0; letter-spacing: -2px; }
.price { font-size: 2.8rem; font-weight: 800; color: var(--accent); margin: 8px 0; }

/* BULLES INFOS (Style de ta photo) */
.pills-detail-box {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 10px; margin: 25px auto; max-width: 600px;
}

.pill-detail {
  padding: 8px 18px; border-radius: 25px;
  background: rgba(144, 154, 169, 0.45); /* Fond gris translucide */
  font-size: 0.85rem; font-weight: 600; color: #fff;
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(5px);
}

.pill-tech-label { font-weight: 800; opacity: 0.9; margin-right: 4px; }

/* --- LE BOUTON PHYSIQUE (Optimisé) --- */
.btn-reserve {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 85px;
  margin: 20px auto 0;
  border-radius: 999px;
  background: #050814;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  cursor: pointer;
  text-decoration: none;
  box-shadow: inset 0 0 18px rgba(40, 90, 255, 0.1), 0 0 25px rgba(0, 0, 0, 0.3);
}

/* Lueur tournante dynamique */
.btn-reserve::before {
  content: "";
  position: absolute;
  inset: -3px;
  background: conic-gradient(from 0deg, transparent 260deg, var(--accent) 300deg, #ffffff 315deg, var(--accent) 330deg, transparent 360deg);
  animation: rotateGlow 2.5s linear infinite;
  z-index: 0;
}

.btn-reserve::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 999px;
  background: #050814;
  z-index: 1;
}

.btn-reserve span {
  position: relative; z-index: 3;
  color: var(--accent);
  font-size: 20px; font-weight: 600;
  letter-spacing: 1px;
  text-shadow: 0 0 10px rgba(80, 120, 255, 0.3);
  transition: color 0.3s;
}

.mouse-aura {
  position: absolute; width: 140px; height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  transform: translate(-50%, -50%);
  pointer-events: none; opacity: 0;
  z-index: 2; transition: opacity 0.25s ease;
  filter: blur(15px);
}

.btn-reserve:hover .mouse-aura { opacity: 0.4; }

@keyframes rotateGlow { to { transform: rotate(360deg); } }

@media (max-width: 1000px) {
  .content-grid { grid-template-columns: 1fr; }
  .btn-reserve { height: 75px; max-width: 100%; }
}
</style>
</head>
<body>

<section class="px-showcase" id="mainShowcase">
  <div class="device-stage" id="stage"></div>

  <button class="nav-arrow prev" onclick="move(-1)">‹</button>
  <button class="nav-arrow next" onclick="move(1)">›</button>

  <div class="content-grid">
    <aside class="glass-card">
      <h3 style="font-size:0.8rem; text-transform:uppercase; opacity:0.5; margin:0 0 15px">Fiche Technique</h3>
      <div id="tech-details"></div>
    </aside>

    <main class="main-copy">
      <h1 id="title">--</h1>
      <div class="price" id="price">--€</div>
      <p id="desc" style="opacity:0.7; font-size: 0.95rem;"></p>
      
      <div class="pills-detail-box" id="pills-detail"></div>
      
      <a href="https://phonexpress.odoo.com/demande-de-devis" target="_blank" class="btn-reserve" id="mainBtn">
        <span>Réserver ce modèle</span>
        <i class="mouse-aura" id="btnAura"></i>
      </a>
    </main>

    <aside class="glass-card">
      <h3 style="font-size:0.8rem; text-transform:uppercase; opacity:0.5; margin:0 0 15px">État & Garantie</h3>
      <div id="stock-status"></div>
      <div id="extra-pills" style="margin-top:15px; display:flex; gap:5px; flex-wrap:wrap"></div>
    </aside>
  </div>
</section>

<script>
const products = [
  {
    title: "iPhone 17 Pro", price: "1299€", accent: "#83aaff", battery: "100%",
    frontImg: "iphone17-face.png", backImg: "iphone17-dos.png",
    details: ["Bleu intense", "256 Go stockage", "OLED 120 Hz", "A19 Pro", "Triple caméra", "12 mois garantie"],
    desc: "L'excellence technologique de demain, disponible dès aujourd'hui."
  },
  {
    title: "iPhone 16 Pro", price: "989€", accent: "#d8d2c4", battery: "96%",
    frontImg: "iphone16-face.png", backImg: "iphone16-dos.png",
    details: ["Titane naturel", "256 Go stockage", "120 Hz ProMotion", "A18 Pro", "Triple caméra", "12 mois garantie"],
    desc: "La puissance du titane sculptée pour les professionnels les plus exigeants."
  },
  {
    title: "iPhone 15 Pro", price: "749€", accent: "#4b617a", battery: "92%",
    frontImg: "iphone15-face.png", backImg: "iphone15-dos.png",
    details: ["Titane bleu", "128 Go stockage", "OLED 120 Hz", "A17 Pro", "Triple caméra Pro", "12 mois garantie"],
    desc: "Un équilibre parfait entre légèreté extrême et performance brute."
  },
  {
    title: "iPhone 14 Pro", price: "599€", accent: "#6f5d88", battery: "88%",
    details: ["Violet intense", "128 Go stockage", "OLED 120 Hz", "A16", "Triple caméra", "6 mois garantie"],
    desc: "L'icône qui a introduit la Dynamic Island et le mode Action."
  }
];

let currentIndex = 0;
const stage = document.getElementById('stage');
const mainBtn = document.getElementById('mainBtn');
const btnAura = document.getElementById('btnAura');

function init() {
  products.forEach((p, i) => {
    const slide = document.createElement('div');
    slide.className = 'device-slide';
    slide.dataset.index = i;
    
    const front = p.frontImg ? `<img src="${p.frontImg}">` : `<svg viewBox="0 0 160 320"><rect width="160" height="320" rx="20" fill="${p.accent}" opacity="0.2"/><text x="50%" y="50%" text-anchor="middle" fill="white">FRONT</text></svg>`;
    const back = p.backImg ? `<img src="${p.backImg}">` : `<svg viewBox="0 0 160 320"><rect width="160" height="320" rx="20" fill="${p.accent}" opacity="0.2"/><text x="50%" y="50%" text-anchor="middle" fill="white">BACK</text></svg>`;

    slide.innerHTML = `<div class="duo"><div class="phone front">${front}</div><div class="phone back">${back}</div></div>`;
    slide.onclick = () => { currentIndex = i; update(); };
    stage.appendChild(slide);
  });
  update();
}

function update() {
  const p = products[currentIndex];
  document.querySelectorAll('.device-slide').forEach((s, i) => {
    let pos = i - currentIndex;
    if (pos > 1) pos -= products.length;
    if (pos < -1) pos += products.length;
    s.dataset.pos = pos;
  });

  document.getElementById('title').textContent = p.title;
  document.getElementById('price').textContent = p.price;
  document.getElementById('desc').textContent = p.desc;
  document.body.style.setProperty('--accent', p.accent);

  // Bulles d'infos
  const container = document.getElementById('pills-detail');
  container.innerHTML = p.details.map(d => `<span class="pill-detail">${d}</span>`).join('');

  document.getElementById('tech-details').innerHTML = `
    <div style="display:flex; justify-content:space-between; margin-bottom:10px"><span>Batterie</span><b>${p.battery}</b></div>
    <div style="display:flex; justify-content:space-between"><span>État</span><b>Excellent</b></div>
  `;
}

function move(dir) {
  currentIndex = (currentIndex + dir + products.length) % products.length;
  update();
}

// Physique du bouton
mainBtn.addEventListener("mousemove", (e) => {
  const rect = mainBtn.getBoundingClientRect();
  btnAura.style.left = `${e.clientX - rect.left}px`;
  btnAura.style.top = `${e.clientY - rect.top}px`;
});

init();
</script>
</body>
</html>
