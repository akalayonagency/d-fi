<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhoneXpress | Catalogue Premium</title>

    <style>
        :root {
            --white: #f7fbff;
            --muted: rgba(247, 251, 255, .7);
            --panel: rgba(8, 14, 28, .8);
            --line: rgba(190, 215, 255, .15);
            --green: #42f3a0;
            --accent: #83aaff; /* Dynamique via JS */
            --transition: 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #020712;
            color: var(--white);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .px-showcase {
            position: relative;
            width: 100%;
            max-width: 1250px;
            margin: auto;
            padding: 40px 20px;
        }

        /* Aura dynamique derrière le téléphone actif */
        .px-showcase::before {
            content: "";
            position: absolute;
            top: 15%; left: 50%;
            width: 600px; height: 450px;
            transform: translateX(-50%);
            background: radial-gradient(circle, var(--accent), transparent 70%);
            opacity: 0.2;
            filter: blur(60px);
            z-index: -1;
            transition: background var(--transition);
        }

        .device-stage {
            position: relative;
            height: 400px;
            perspective: 2000px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Logique des Slides --- */
        .device-slide {
            position: absolute;
            width: 180px;
            height: 360px;
            transition: all var(--transition), opacity 0.6s ease, filter 0.8s ease;
            cursor: pointer;
            user-select: none;
            will-change: transform, opacity;
        }

        /* Positions */
        .device-slide { opacity: 0; transform: translateZ(-500px); pointer-events: none; }
        
        .device-slide[data-pos="0"] { /* Active */
            opacity: 1; z-index: 10; pointer-events: auto;
            width: 440px; transform: translateZ(200px);
        }
        .device-slide[data-pos="-1"] { opacity: 0.4; z-index: 5; transform: translateX(-320px) rotateY(45deg) scale(0.8); filter: blur(2px); }
        .device-slide[data-pos="1"] { opacity: 0.4; z-index: 5; transform: translateX(320px) rotateY(-45deg) scale(0.8); filter: blur(2px); }
        .device-slide[data-pos="-2"] { opacity: 0.1; z-index: 2; transform: translateX(-550px) rotateY(60deg) scale(0.6); filter: blur(6px); }
        .device-slide[data-pos="2"] { opacity: 0.1; z-index: 2; transform: translateX(550px) rotateY(-60deg) scale(0.6); filter: blur(6px); }

        .duo { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; }
        .phone { position: absolute; transition: var(--transition); filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5)); }
        
        .device-slide[data-pos="0"] .phone.front { transform: translateX(45px) rotateY(-10deg); }
        .device-slide[data-pos="0"] .phone.back { transform: translateX(215px) rotateY(15deg); opacity: 1; }
        .device-slide:not([data-pos="0"]) .phone.back { opacity: 0; }
        .device-slide:not([data-pos="0"]) .phone.front { transform: translateX(0); }

        .phone img, .phone svg { width: 160px; height: auto; display: block; }

        /* --- Navigation --- */
        .nav-arrow {
            position: absolute; top: 180px; z-index: 30;
            width: 54px; height: 54px; border-radius: 50%;
            background: rgba(255,255,255,0.05); border: 1px solid var(--line);
            color: white; backdrop-filter: blur(10px); cursor: pointer;
            transition: 0.3s; font-size: 24px;
        }
        .nav-arrow:hover { background: var(--accent); border-color: white; color: #000; transform: scale(1.1); }
        .nav-arrow.prev { left: 5%; }
        .nav-arrow.next { right: 5%; }

        /* --- Grille de contenu --- */
        .content-grid {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 30px; margin-top: 20px; align-items: start;
        }

        .glass-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(20px);
        }

        .main-copy { text-align: center; }
        h1 { font-size: 3.5rem; margin: 0; letter-spacing: -2px; }
        .price { font-size: 3rem; font-weight: 800; color: var(--accent); margin: 10px 0; }

        .pill-box { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
        .pill { padding: 6px 14px; border-radius: 20px; background: rgba(255,255,255,0.05); font-size: 0.8rem; border: 1px solid var(--line); }

        .btn-buy {
            background: var(--white); color: #000; border: none;
            padding: 16px 40px; border-radius: 40px; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 20px;
        }
        .btn-buy:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--accent); }

        @media (max-width: 1000px) {
            .content-grid { grid-template-columns: 1fr; }
            .device-slide[data-pos="0"] { width: 320px; }
            .nav-arrow { top: 120px; }
        }
    </style>
</head>
<body>

<section class="px-showcase" id="mainShowcase" aria-roledescription="carousel">
    <div class="device-stage" id="stage"></div>

    <button class="nav-arrow prev" aria-label="Précédent" onclick="move(-1)">‹</button>
    <button class="nav-arrow next" aria-label="Suivant" onclick="move(1)">›</button>

    <div class="content-grid" aria-live="polite">
        <aside class="glass-card">
            <h3 style="font-size:0.9rem; text-transform:uppercase; opacity:0.6">Fiche Technique</h3>
            <div id="tech-details"></div>
        </aside>

        <main class="main-copy">
            <h1 id="title">--</h1>
            <div class="price" id="price">--€</div>
            <p id="desc" style="opacity:0.7; line-height:1.6"></p>
            <button class="btn-buy">Réserver maintenant</button>
        </main>

        <aside class="glass-card">
            <h3 style="font-size:0.9rem; text-transform:uppercase; opacity:0.6">Disponibilité</h3>
            <div id="stock-status" style="margin: 15px 0"></div>
            <div class="pill-box" id="pills"></div>
        </aside>
    </div>
</section>

<script>
const products = [
    { id: 1, title: "iPhone 17 Pro", price: "1299€", accent: "#83aaff", battery: "100%", storage: "256GB", stock: "En stock", chip: "A19 Pro", desc: "La nouvelle frontière de la puissance mobile avec puce photonique." },
    { id: 2, title: "iPhone 16 Pro", price: "989€", accent: "#d8d2c4", battery: "96%", storage: "256GB", stock: "3 restants", chip: "A18 Pro", desc: "Le titane naturel allié à une polyvalence photographique pro." },
    { id: 3, title: "iPhone 15 Pro", price: "749€", accent: "#4b617a", battery: "92%", storage: "128GB", stock: "En stock", chip: "A17 Pro", desc: "Légèreté et performance avec le premier châssis titane." },
    { id: 4, title: "iPhone 14 Pro", price: "599€", accent: "#6f5d88", battery: "88%", storage: "128GB", stock: "Dernière pièce", chip: "A16", desc: "L'arrivée de la Dynamic Island pour une interface réinventée." },
    { id: 5, title: "iPhone 13", price: "429€", accent: "#2f78b7", battery: "89%", storage: "128GB", stock: "En stock", chip: "A15", desc: "Un classique indémodable avec une autonomie exceptionnelle." }
];

let currentIndex = 0;
let autoPlay = setInterval(() => move(1), 5000);

const stage = document.getElementById('stage');
const showcase = document.getElementById('mainShowcase');

// Initialisation du DOM permanent
function init() {
    products.forEach((p, i) => {
        const slide = document.createElement('div');
        slide.className = 'device-slide';
        slide.dataset.index = i;
        slide.innerHTML = `
            <div class="duo">
                <div class="phone front">${getPlaceholderSVG(p.accent, 'FRONT')}</div>
                <div class="phone back">${getPlaceholderSVG(p.accent, 'BACK')}</div>
            </div>
        `;
        slide.onclick = () => { currentIndex = i; update(); };
        stage.appendChild(slide);
    });
    update();
}

function update() {
    // 1. Positionnement des slides
    document.querySelectorAll('.device-slide').forEach((slide, i) => {
        let offset = i - currentIndex;
        // Gérer la boucle infinie pour le positionnement
        if (offset > 2) offset -= products.length;
        if (offset < -2) offset += products.length;
        slide.dataset.pos = offset;
    });

    // 2. Mise à jour des textes
    const p = products[currentIndex];
    document.getElementById('title').textContent = p.title;
    document.getElementById('price').textContent = p.price;
    document.getElementById('desc').textContent = p.desc;
    document.body.style.setProperty('--accent', p.accent);

    // 3. Mise à jour des détails
    document.getElementById('tech-details').innerHTML = `
        <div style="display:flex; justify-content:space-between; margin:10px 0; border-bottom:1px solid var(--line); padding-bottom:5px">
            <span>Batterie</span> <b>${p.battery}</b>
        </div>
        <div style="display:flex; justify-content:space-between; margin:10px 0">
            <span>Processeur</span> <b>${p.chip}</b>
        </div>
    `;

    document.getElementById('stock-status').innerHTML = `
        <span style="color:var(--green)">●</span> ${p.stock}
    `;

    document.getElementById('pills').innerHTML = `
        <span class="pill">${p.storage}</span>
        <span class="pill">Garantie 12 mois</span>
    `;
}

function move(dir) {
    currentIndex = (currentIndex + dir + products.length) % products.length;
    update();
    resetAutoPlay();
}

// Support Tactile (Swipe)
let touchStart = 0;
showcase.addEventListener('touchstart', e => touchStart = e.touches[0].clientX);
showcase.addEventListener('touchend', e => {
    const touchEnd = e.changedTouches[0].clientX;
    if (touchStart - touchEnd > 50) move(1);
    if (touchStart - touchEnd < -50) move(-1);
});

// Gestion AutoPlay
showcase.onmouseenter = () => clearInterval(autoPlay);
showcase.onmouseleave = () => resetAutoPlay();

function resetAutoPlay() {
    clearInterval(autoPlay);
    autoPlay = setInterval(() => move(1), 5000);
}

// Fonction utilitaire pour générer des placeholders SVG propres (remplaçables par <img>)
function getPlaceholderSVG(color, label) {
    return `
    <svg viewBox="0 0 160 320" xmlns="http://www.w3.org/2000/svg">
        <rect width="160" height="320" rx="24" fill="#080e1c" stroke="rgba(255,255,255,0.1)"/>
        <rect x="5" y="5" width="150" height="310" rx="20" fill="${color}" opacity="0.15"/>
        <text x="50%" y="50%" text-anchor="middle" fill="white" font-size="12" opacity="0.5">${label}</text>
    </svg>`;
}

init();
</script>
</body>
</html>
