<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhoneXpress Carousel</title>
  <style>
    :root {
      --text: #ffffff;
      --muted: rgba(255,255,255,.7);
      --accent: #6ee7ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent;
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      height: 600px;
      position: relative;
      perspective: 1200px;
    }

    .phone-card {
      position: absolute;
      left: 50%;
      top: 45%;
      width: 220px;
      height: 440px;
      transform-style: preserve-3d;
      transition: all .8s cubic-bezier(.22,1,.36,1);
      opacity: 0;
      filter: blur(6px);
    }

    .phone-card[data-position="0"] {
      transform: translate(-50%, -50%) translateZ(150px) scale(1.1);
      opacity: 1;
      filter: none;
      z-index: 10;
    }

    .phone-card[data-position="-1"] {
      transform: translate(-50%, -50%) translateX(-260px) scale(.85) rotateY(-10deg);
      opacity: .7;
    }

    .phone-card[data-position="1"] {
      transform: translate(-50%, -50%) translateX(260px) scale(.85) rotateY(10deg);
      opacity: .7;
    }

    .phone-card[data-position="-2"] {
      transform: translate(-50%, -50%) translateX(-480px) scale(.65);
      opacity: .3;
    }

    .phone-card[data-position="2"] {
      transform: translate(-50%, -50%) translateX(480px) scale(.65);
      opacity: .3;
    }

    .phone {
      width: 100%;
      height: 100%;
      border-radius: 40px;
      background: var(--phone-body);
      box-shadow: 0 30px 80px rgba(0,0,0,.4);
      position: relative;
    }

    .camera-block {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 90px;
      height: 90px;
      border-radius: 25px;
      background: rgba(0,0,0,.2);
    }

    .lens {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #111;
    }

    .lens.one { top: 10px; left: 10px; }
    .lens.two { bottom: 10px; right: 10px; }

    .info {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      max-width: 500px;
    }

    .title {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 18px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .chip {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
    }

    .arrow {
      position: absolute;
      top: 45%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.1);
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      color: white;
    }

    .prev { left: 10px; }
    .next { right: 10px; }
  </style>
</head>
<body>

<div class="stage" id="stage"></div>

<button class="arrow prev" onclick="prev()">‹</button>
<button class="arrow next" onclick="next()">›</button>

<div class="info">
  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="chips" id="chips"></div>
</div>

<script>
const products = [
  { name:"iPhone 15 Pro", storage:"256 Go", condition:"Excellent", battery:"92%", repaired:"Aucune", body:"linear-gradient(#aaa,#555)" },
  { name:"iPhone 14 Pro", storage:"128 Go", condition:"Très bon", battery:"89%", repaired:"Écran changé", body:"linear-gradient(#6b5,#224)" },
  { name:"iPhone 14", storage:"128 Go", condition:"Excellent", battery:"94%", repaired:"Aucune", body:"linear-gradient(#59c,#234)" },
  { name:"iPhone 13", storage:"256 Go", condition:"Bon", battery:"86%", repaired:"Batterie changée", body:"linear-gradient(#333,#000)" },
  { name:"iPhone SE", storage:"64 Go", condition:"Très bon", battery:"91%", repaired:"Aucune", body:"linear-gradient(#eee,#aaa)" }
];

const stage = document.getElementById("stage");
let active = 0;

function build(){
  stage.innerHTML = products.map((p,i)=>`
    <div class="phone-card" data-index="${i}" style="--phone-body:${p.body}">
      <div class="phone">
        <div class="camera-block">
          <div class="lens one"></div>
          <div class="lens two"></div>
        </div>
      </div>
    </div>
  `).join("");
}

function update(){
  document.querySelectorAll(".phone-card").forEach(card=>{
    const i = +card.dataset.index;
    let d = i - active;
    if(d>2) d-=5;
    if(d<-2) d+=5;
    card.dataset.position = Math.abs(d)>2?"hidden":d;
  });

  const p = products[active];
  title.textContent = p.name;
  subtitle.textContent = `${p.storage} · ${p.condition}`;
  chips.innerHTML = `
    <div class="chip">Batterie ${p.battery}</div>
    <div class="chip">${p.repaired}</div>
  `;
}

function next(){ active=(active+1)%5; update(); }
function prev(){ active=(active-1+5)%5; update(); }

build();
update();
</script>

</body>
</html>
