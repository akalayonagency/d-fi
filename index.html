<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Produit</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

/* CONTAINER */
.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 60px;
  max-width: 1200px;
  margin: auto;
}

/* LEFT BOX */
.card {
  background: #2e2e2e;
  color: white;
  padding: 20px;
  border-radius: 15px;
  width: 220px;
}

/* CENTER */
.center {
  text-align: center;
}

/* IPHONE FLIP */
.phone-container {
  width: 260px;
  height: 520px;
  perspective: 1000px;
  margin: 20px auto;
  cursor: pointer;
}

.phone {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s;
}

.phone.flip {
  transform: rotateY(180deg);
}

.phone img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  backface-visibility: hidden;
}

.phone .back {
  transform: rotateY(180deg);
}

/* TITLE */
h1 {
  font-size: 50px;
  margin: 10px 0;
}

.sub {
  font-size: 20px;
  color: #666;
}

/* BUTTON */
.btn {
  margin-top: 20px;
  padding: 18px 40px;
  font-size: 18px;
  border-radius: 40px;
  border: none;
  background: linear-gradient(135deg, #6c4cff, #8f6bff);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.05);
}

/* RIGHT BOX */
.price-box {
  background: #2e2e2e;
  color: white;
  padding: 25px;
  border-radius: 15px;
  width: 220px;
  text-align: center;
}

.price {
  font-size: 40px;
  margin: 10px 0;
}
</style>
</head>

<body>

<div class="hero">

  <!-- LEFT -->
  <div class="card">
    <h3>Détails</h3>
    <p>État : Très bon</p>
    <p>Batterie : 89%</p>
    <p>Garantie : 6 mois</p>
    <p>Débloqué</p>
  </div>

  <!-- CENTER -->
  <div class="center">

    <h1>iPhone 14 Pro</h1>
    <div class="sub">Violet intense • 128 Go</div>

    <!-- PHONE -->
    <div class="phone-container" onclick="flipPhone()">
      <div class="phone" id="phone">
        <img src="face.png" alt="face">
        <img src="dos.png" class="back" alt="dos">
      </div>
    </div>

    <button class="btn">Réserver ce modèle</button>

  </div>

  <!-- RIGHT -->
  <div class="price-box">
    <div>Prix</div>
    <div class="price">579€</div>
    <p>Testé et prêt</p>
  </div>

</div>

<script>
function flipPhone() {
  document.getElementById("phone").classList.toggle("flip");
}
</script>

</body>
</html>
