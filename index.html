<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhoneXpress Carousel</title>

  <style>
    :root {
      --text: #fff;
      --muted: rgba(255,255,255,.68);
      --border: rgba(255,255,255,.12);
      --glass: rgba(18,18,20,.72);
      --green: #57f29a;
      --purple: #9b6cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      background: transparent;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      color: var(--text);
    }

    .carousel-wrapper {
      position: relative;
      width: 100%;
      min-height: 720px;
      background: transparent;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      height: 560px;
      position: relative;
      perspective: 1200px;
      pointer-events: none;
    }

    .phone-card {
      position: absolute;
      left: 50%;
      top: 48%;
      width: 220px;
      height: 440px;
      transform-style: preserve-3d;
      transition: all .8s cubic-bezier(.22,1,.36,1);
      opacity: 0;
      filter: blur(7px);
    }

    .phone-card[data-position="0"] {
      transform: translate(-50%, -50%) translateZ(160px) scale(1.15);
      opacity: 1;
      filter: none;
      z-index: 10;
    }

    .phone-card[data-position="-1"] {
      transform: translate(-50%, -50%) translateX(-270px) scale(.88);
      opacity: .65;
      z-index: 5;
    }

    .phone-card[data-position="1"] {
      transform: translate(-50%, -50%) translateX(270px) scale(.88);
      opacity: .65;
      z-index: 5;
    }

    .phone-card[data-position="-2"] {
      transform: translate(-50%, -50%) translateX(-500px) scale(.67);
      opacity: .25;
      z-index: 1;
    }

    .phone-card[data-position="2"] {
      transform: translate(-50%, -50%) translateX(500px) scale(.67);
      opacity: .25;
      z-index: 1;
    }

    .phone-card[data-position="hidden"] {
      opacity: 0;
      pointer-events: none;
    }

    .phone {
      width: 100%;
      height: 100%;
      border-radius: 42px;
      background: var(--phone-body);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.12),
        inset 0 12px 30px rgba(255,255,255,.08),
        0 35px 90px rgba(0,0,0,.5);
      position: relative;
    }

    .camera-block {
      position: absolute;
      top: 18px;
      left: 18px;
      width: 88px;
      height: 88px;
      border-radius: 26px;
      background: rgba(255,255,255,.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }

    .lens {
      position: absolute;
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #22395c, #02040a 65%);
      box-shadow: 0 0 0 4px rgba(0,0,0,.18);
    }

    .lens.one { top: 10px; left: 10px; }
    .lens.two { bottom: 10px; left: 18px; }
    .lens.three { top: 26px; right: 9px; }

    .flash {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f3ead2;
      box-shadow: 0 0 18px rgba(255,255,255,.35);
    }

    .logo-dot {
      position: absolute;
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,.22);
    }

    .info {
      position: absolute;
      left: 50%;
      bottom: 62px;
      transform: translateX(-50%);
      width: min(760px, 92vw);
      text-align: center;
      z-index: 20;
    }

    .eyebrow {
      color: var(--purple);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .32em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .title {
      font-size: clamp(48px, 8vw, 82px);
      line-height: .9;
      font-weight: 950;
      letter-spacing: -.06em;
      margin-bottom: 12px;
      text-shadow: 0 15px 40px rgba(0,0,0,.55);
    }

    .subtitle {
      font-size: clamp(18px, 2.4vw, 25px);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .description {
      max-width: 620px;
      margin: 0 auto 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 13px 22px;
      font-weight: 850;
      font-size: 14px;
      cursor: pointer;
    }

    .btn.primary {
      background: #fff;
      color: #111;
    }

    .btn.secondary {
      background: rgba(255,255,255,.08);
      color: #fff;
      backdrop-filter: blur(12px);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chip {
      font-size: 12px;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(255,255,255,.09);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      color: #fff;
    }

    .chip strong {
      color: #fff;
    }

    .chip.green::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 7px;
    }

    .details-card,
    .price-card {
      position: absolute;
      bottom: 90px;
      width: 270px;
      padding: 20px;
      border-radius: 22px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      z-index: 25;
      box-shadow: 0 24px 60px rgba(0,0,0,.3);
    }

    .details-card {
      left: 11%;
    }

    .price-card {
      right: 11%;
    }

    .card-title {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-top: 1px solid rgba(255,255,255,.08);
      color: var(--muted);
      font-size: 13px;
    }

    .row strong {
      color: #fff;
    }

    .price-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 36px;
      font-weight: 950;
      letter-spacing: -.04em;
      margin-bottom: 12px;
    }

    .price-text {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .stock {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      border: 1px solid rgba(87,242,154,.35);
      background: rgba(87,242,154,.13);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 900;
    }

    .stock::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .arrow {
      position: absolute;
      top: 45%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.2);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      cursor: pointer;
      color: white;
      font-size: 42px;
      z-index: 30;
      backdrop-filter: blur(10px);
    }

    .prev { left: 10%; }
    .next { right: 10%; }

    @media (max-width: 980px) {
      .details-card,
      .price-card {
        display: none;
      }

      .prev { left: 18px; }
      .next { right: 18px; }

      .phone-card[data-position="-1"] {
        transform: translate(-50%, -50%) translateX(-190px) scale(.75);
      }

      .phone-card[data-position="1"] {
        transform: translate(-50%, -50%) translateX(190px) scale(.75);
      }

      .phone-card[data-position="-2"],
      .phone-card[data-position="2"] {
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<section class="carousel-wrapper">

  <div class="stage" id="stage"></div>

  <button class="arrow prev" onclick="prev()">‹</button>
  <button class="arrow next" onclick="next()">›</button>

  <div class="details-card">
    <div class="card-title">Détails acheteur</div>
    <div class="row">
      <span>État esthétique</span>
      <strong id="detailCondition"></strong>
    </div>
    <div class="row">
      <span>Batterie</span>
      <strong id="detailBattery"></strong>
    </div>
    <div class="row">
      <span>Garantie</span>
      <strong>6 mois</strong>
    </div>
    <div class="row">
      <span>Déblocage</span>
      <strong>Tout opérateur</strong>
    </div>
  </div>

  <div class="price-card">
    <div class="price-label">Prix PhoneXpress</div>
    <div class="price" id="price"></div>
    <div class="price-text">
      Contrôlé, nettoyé, testé et prêt à partir. Paiement possible à la livraison selon disponibilité.
    </div>
    <div class="stock" id="stock"></div>
  </div>

  <div class="info">
    <div class="eyebrow">Disponible · Réparation signalée</div>
    <div class="title" id="title"></div>
    <div class="subtitle" id="subtitle"></div>
    <div class="description" id="description"></div>

    <div class="actions">
      <button class="btn primary">Réserver ce modèle</button>
      <button class="btn secondary">Demander des photos</button>
    </div>

    <div class="chips" id="chips"></div>
  </div>

</section>

<script>
const products = [
  {
    name: "iPhone 15 Pro",
    color: "Titane naturel",
    storage: "256 Go",
    condition: "Excellent",
    battery: "92%",
    repaired: "Aucune réparation",
    price: "749€",
    stock: "1 pièce disponible",
    year: "2023",
    body: "linear-gradient(145deg,#b8b3aa,#5d5a55)"
  },
  {
    name: "iPhone 14 Pro",
    color: "Violet intense",
    storage: "128 Go",
    condition: "Très bon état",
    battery: "89%",
    repaired: "Écran remplacé par pièce premium",
    price: "579€",
    stock: "2 pièces disponibles",
    year: "2022",
    body: "linear-gradient(145deg,#807090,#3b304f)"
  },
  {
    name: "iPhone 14",
    color: "Bleu",
    storage: "128 Go",
    condition: "Excellent",
    battery: "94%",
    repaired: "Aucune réparation",
    price: "449€",
    stock: "3 pièces disponibles",
    year: "2022",
    body: "linear-gradient(145deg,#9fc1d9,#41677e)"
  },
  {
    name: "iPhone 13",
    color: "Minuit",
    storage: "256 Go",
    condition: "Bon état",
    battery: "86%",
    repaired: "Batterie changée",
    price: "389€",
    stock: "1 pièce disponible",
    year: "2021",
    body: "linear-gradient(145deg,#32383d,#090b0e)"
  },
  {
    name: "iPhone SE",
    color: "Lumière stellaire",
    storage: "64 Go",
    condition: "Très bon état",
    battery: "91%",
    repaired: "Aucune réparation",
    price: "219€",
    stock: "4 pièces disponibles",
    year: "2022",
    body: "linear-gradient(145deg,#f2eee5,#a7a097)"
  }
];

const stage = document.getElementById("stage");
let active = 1;

function build() {
  stage.innerHTML = products.map((p, i) => `
    <div class="phone-card" data-index="${i}" style="--phone-body:${p.body}">
      <div class="phone">
        <div class="camera-block">
          <div class="lens one"></div>
          <div class="lens two"></div>
          <div class="lens three"></div>
          <div class="flash"></div>
        </div>
        <div class="logo-dot"></div>
      </div>
    </div>
  `).join("");
}

function update() {
  document.querySelectorAll(".phone-card").forEach(card => {
    const i = Number(card.dataset.index);
    let d = i - active;

    if (d > 2) d -= products.length;
    if (d < -2) d += products.length;

    card.dataset.position = Math.abs(d) > 2 ? "hidden" : d;
  });

  const p = products[active];

  title.textContent = p.name;
  subtitle.textContent = `${p.color} · ${p.storage} · ${p.condition}`;
  description.textContent =
    "Un excellent compromis pour profiter d’un écran fluide, d’un très bon module photo et d’un appareil contrôlé avant mise en vente.";

  detailCondition.textContent = p.condition;
  detailBattery.textContent = p.battery;
  price.textContent = p.price;
  stock.textContent = p.stock;

  chips.innerHTML = `
    <div class="chip green"><strong>${p.battery}</strong> batterie</div>
    <div class="chip"><strong>${p.year}</strong> année</div>
    <div class="chip"><strong>${p.storage}</strong> stockage</div>
    <div class="chip">${p.repaired}</div>
    <div class="chip">Dynamic Island</div>
    <div class="chip">Écran testé</div>
    <div class="chip">Triple caméra</div>
    <div class="chip">Garantie incluse</div>
  `;
}

function next() {
  active = (active + 1) % products.length;
  update();
}

function prev() {
  active = (active - 1 + products.length) % products.length;
  update();
}

build();
update();
</script>

</body>
</html>
