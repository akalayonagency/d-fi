<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showcase premium</title>

<style>
:root{
  --white:#f7fbff;
  --muted:rgba(247,251,255,.72);
  --blue:#7aa7ff;
  --navy:#020712;
  --panel:rgba(2,7,18,.72);
  --line:rgba(180,210,255,.22);
}

/* RESET */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial;
  color:var(--white);
  background:transparent;
}

/* CONTAINER */
.px{
  max-width:1100px;
  margin:auto;
  padding:40px 20px;
  text-align:center;
  position:relative;
}

/* GLOW */
.px::before{
  content:"";
  position:absolute;
  left:50%;
  top:120px;
  width:500px;
  height:500px;
  transform:translateX(-50%);
  background:radial-gradient(circle, rgba(120,168,255,.4), transparent 70%);
  filter:blur(50px);
  z-index:-1;
}

/* CAROUSEL */
.stage{
  position:relative;
  height:350px;
  perspective:1600px;
}

.slide{
  position:absolute;
  left:50%;
  top:50%;
  transform-style:preserve-3d;
  transition:1s cubic-bezier(.19,1,.22,1);
  cursor:pointer;
}

/* POSITIONS */
.active{
  transform:translate(-50%,-50%) translateZ(200px) scale(1);
  z-index:10;
}
.left{
  transform:translate(calc(-50% - 250px),-50%) rotateY(40deg) scale(.7);
  opacity:.5;
}
.right{
  transform:translate(calc(-50% + 250px),-50%) rotateY(-40deg) scale(.7);
  opacity:.5;
}

/* PHONE */
.duo{
  display:flex;
  gap:20px;
  animation:float 5s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

.phone{
  width:150px;
  filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));
}

.phone img{
  width:100%;
}

/* TEXT */
h1{
  font-size:60px;
  margin:10px 0;
}
.sub{
  font-size:22px;
  margin-bottom:15px;
}

/* BUTTON */
.btn{
  padding:15px 40px;
  border-radius:30px;
  border:none;
  background:#0a0f1f;
  color:white;
  box-shadow:0 0 25px rgba(120,168,255,.5);
  cursor:pointer;
}

/* INFOS */
.pills{
  margin-top:20px;
}
.pill{
  display:inline-block;
  margin:5px;
  padding:8px 14px;
  background:rgba(255,255,255,.1);
  border-radius:20px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="px">

  <div class="stage" id="stage"></div>

  <h1 id="title">iPhone 17 Pro</h1>
  <div class="sub" id="subtitle">Bleu intense • 256 Go</div>

  <button class="btn">Réserver ce modèle</button>

  <div class="pills" id="pills"></div>

</div>

<script>
const products = [
  {
    title:"iPhone 17 Pro",
    subtitle:"Bleu intense • 256 Go",
    pills:["256 Go","Batterie 96%","ProMotion","Garantie"],
    front:"face.png",
    back:"dos.png"
  },
  {
    title:"iPhone 17",
    subtitle:"Lavande • 128 Go",
    pills:["128 Go","Neuf","A19","Dual Cam"]
  },
  {
    title:"Samsung S25",
    subtitle:"Noir • 256 Go",
    pills:["256 Go","AMOLED","Snapdragon"]
  }
];

let index = 0;
const stage = document.getElementById("stage");

function render(){
  stage.innerHTML="";
  
  products.forEach((p,i)=>{
    const div=document.createElement("div");
    div.className="slide";

    if(i===index) div.classList.add("active");
    else if(i===index-1) div.classList.add("left");
    else if(i===index+1) div.classList.add("right");

    div.innerHTML=`
      <div class="duo">
        <div class="phone">
          ${p.front ? `<img src="${p.front}">` : `<div style="width:150px;height:300px;background:#222;border-radius:20px"></div>`}
        </div>
        <div class="phone">
          ${p.back ? `<img src="${p.back}">` : ``}
        </div>
      </div>
    `;

    div.onclick=()=>{
      index=i;
      render();
    }

    stage.appendChild(div);
  });

  const p=products[index];
  document.getElementById("title").innerText=p.title;
  document.getElementById("subtitle").innerText=p.subtitle;
  
  document.getElementById("pills").innerHTML =
    p.pills.map(x=>`<span class="pill">${x}</span>`).join("");
}

render();
</script>

</body>
</html>
