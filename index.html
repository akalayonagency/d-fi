<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PhoneXpress – Vente de Smartphones</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #3a9eff;
  --blue-light: #7ec4ff;
  --blue-pale: #b8dbff;
  --panel: rgba(180,215,255,0.10);
  --panel-strong: rgba(160,205,255,0.16);
  --border: rgba(120,185,255,0.18);
  --border-accent: rgba(100,175,255,0.32);
  --white: #eef6ff;
  --muted: rgba(180,215,255,0.60);
  --success: #3dffa0;
  --warn: #ffb443;
  --font-display: 'Rajdhani', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --radius: 14px;
  --radius-sm: 8px;
  --ease: cubic-bezier(0.22,1,0.36,1);
  --speed: 580ms;
}

html, body {
  background: transparent;
  color: var(--white);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── GLASS CARD avec canvas particles intégré ─── */
.glass-card {
  position: relative;
  overflow: hidden;
  padding: 20px;
  border: 1px solid var(--border-accent);
  border-radius: var(--radius);
  background: var(--panel);
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
}
.glass-card canvas {
  position: absolute;
  inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.glass-card > *:not(canvas) { position: relative; z-index: 1; }

.card-label {
  font-size: 0.68rem; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--blue-light); margin-bottom: 14px;
}

.spec-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid rgba(120,185,255,0.12);
  font-size: 0.84rem; color: var(--muted);
}
.spec-row:last-child { border-bottom: 0; padding-bottom: 0; }
.spec-row strong { color: var(--white); font-weight: 600; }

/* ─── SHOWCASE ─── */
.showcase-wrap {
  position: relative; z-index: 1;
  padding: clamp(32px,5vw,60px) clamp(16px,4vw,48px) clamp(40px,6vw,70px);
  max-width: 1280px; margin: 0 auto;
}

.stage {
  position: relative;
  height: clamp(340px,40vw,480px);
  perspective: 1600px;
  margin-bottom: 32px;
  overflow: visible;
}

.slide {
  position: absolute;
  left: 50%; top: 50%;
  width: clamp(220px,28vw,320px);
  display: flex; flex-direction: column; align-items: center;
  opacity: 0; pointer-events: none;
  transition: all var(--speed) var(--ease);
  will-change: transform, opacity;
  cursor: pointer;
  transform-style: preserve-3d;
  background: none; border: none;
  transform: translate(-50%,-50%);
}
.slide[data-p="0"] {
  opacity: 1; pointer-events: auto; z-index: 10;
  transform: translate(-50%,-50%) translateZ(80px) scale(1);
  filter: none;
}
.slide[data-p="-1"] {
  opacity: 0.42; pointer-events: auto; z-index: 5;
  transform: translate(calc(-50% - clamp(200px,22vw,295px)),-50%) translateZ(-60px) rotateY(32deg) scale(0.82);
  filter: brightness(0.65) saturate(0.5);
}
.slide[data-p="1"] {
  opacity: 0.42; pointer-events: auto; z-index: 5;
  transform: translate(calc(-50% + clamp(200px,22vw,295px)),-50%) translateZ(-60px) rotateY(-32deg) scale(0.82);
  filter: brightness(0.65) saturate(0.5);
}
.slide[data-p="-2"] {
  opacity: 0.10; z-index: 2;
  transform: translate(calc(-50% - clamp(330px,36vw,450px)),-50%) translateZ(-180px) rotateY(50deg) scale(0.62);
  filter: brightness(0.35) saturate(0.3);
}
.slide[data-p="2"] {
  opacity: 0.10; z-index: 2;
  transform: translate(calc(-50% + clamp(330px,36vw,450px)),-50%) translateZ(-180px) rotateY(-50deg) scale(0.62);
  filter: brightness(0.35) saturate(0.3);
}

/* ─── PHONE DUO ─── */
.phone-duo {
  position: relative;
  width: 280px; height: 310px;
  transform-style: preserve-3d;
}
.phone-slot {
  position: absolute;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--speed) var(--ease);
}
.phone-slot.front {
  width: 142px; height: 284px;
  left: 28px; top: 0; z-index: 4;
  transform: rotateY(-8deg) rotateZ(-1.5deg) translateZ(30px);
}
.phone-slot.back {
  width: 130px; height: 262px;
  left: 128px; top: 18px; z-index: 3;
  transform: rotateY(12deg) rotateZ(2deg);
}
.phone-slot img {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 22px 38px rgba(0,20,60,0.55));
  user-select: none; -webkit-user-drag: none;
  display: block; border-radius: 18px;
}
.phone-shell {
  width: 100%; height: 100%;
  border-radius: 26px;
  border: 1.5px solid rgba(255,255,255,0.18);
  background: linear-gradient(145deg, var(--ca), var(--cb));
  position: relative; overflow: hidden;
  box-shadow: inset 0 0 0 6px rgba(0,0,0,0.28), 0 24px 50px rgba(0,0,0,0.45);
}
.phone-shell::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(120deg, rgba(255,255,255,0.13) 0%, transparent 52%);
}
.front .phone-shell::before {
  content: '';
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  width: 44px; height: 13px; border-radius: 999px;
  background: #060a10; z-index: 2;
}
.back .phone-shell::before {
  content: '';
  position: absolute; top: 14px; left: 14px;
  width: 56px; height: 56px; border-radius: 16px;
  background: rgba(0,0,0,0.3);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); z-index: 2;
}

.slide:not([data-p="0"]) .phone-slot.back { opacity: 0; }
.slide:not([data-p="0"]) .phone-duo { width: 130px; }
.slide:not([data-p="0"]) .phone-slot.front { left: 0; transform: none; }

/* ─── UPLOAD ZONE ─── */
.upload-zone {
  display: flex; gap: 8px;
  margin-top: 14px;
  opacity: 0; pointer-events: none;
  transition: opacity 280ms;
}
.slide[data-p="0"] .upload-zone { opacity: 1; pointer-events: auto; }
.upload-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; border-radius: 999px;
  border: 1px solid var(--border-accent);
  background: rgba(58,158,255,0.10);
  color: var(--blue-pale);
  font-family: var(--font-body);
  font-size: 0.71rem; font-weight: 600; letter-spacing: 0.03em;
  cursor: pointer; transition: all 180ms;
}
.upload-btn:hover { background: rgba(58,158,255,0.22); border-color: var(--blue-light); color: #fff; }
.upload-btn svg { width: 12px; height: 12px; stroke-width: 2.4; flex-shrink: 0; }
.upload-btn input[type="file"] { display: none; }

/* ─── CONTROLS ─── */
.ctrl {
  position: absolute; top: 48%; z-index: 20;
  width: 48px; height: 48px;
  display: grid; place-items: center;
  border: 1px solid var(--border-accent);
  border-radius: 50%;
  background: var(--panel-strong);
  color: var(--blue-pale);
  cursor: pointer; backdrop-filter: blur(14px);
  transform: translateY(-50%);
  transition: all 180ms ease;
}
.ctrl:hover { border-color: var(--blue); background: rgba(58,158,255,0.22); color: #fff; transform: translateY(-50%) scale(1.07); }
.ctrl svg { width: 20px; height: 20px; stroke-width: 2.4; }
.ctrl.prev { left: clamp(0px,5vw,70px); }
.ctrl.next { right: clamp(0px,5vw,70px); }

/* ─── CONTENT ZONE ─── */
.content-zone {
  display: grid;
  grid-template-columns: 230px 1fr 230px;
  gap: 20px; align-items: start;
  margin-bottom: 24px;
}

/* ─── MAIN COPY ─── */
.main-copy { text-align: center; padding: 0 10px; animation: fadeUp 380ms var(--ease) both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.prod-name {
  font-family: var(--font-display);
  font-size: clamp(2rem,4.5vw,3.6rem);
  font-weight: 700; letter-spacing: 0.02em;
  text-transform: uppercase; line-height: 1; margin-bottom: 8px;
}
.prod-price {
  font-family: var(--font-display);
  font-size: clamp(1.8rem,3.8vw,3rem);
  font-weight: 600; color: var(--blue-light); margin-bottom: 12px;
}
.prod-desc { color: var(--muted); font-size: 0.88rem; line-height: 1.65; max-width: 440px; margin: 0 auto 16px; }
.pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-bottom: 22px; }
.pill {
  font-size: 0.72rem; font-weight: 600; padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid rgba(100,175,255,0.24);
  background: rgba(58,158,255,0.10);
  color: var(--blue-light); letter-spacing: 0.02em;
}
.cta-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 9px;
  height: 50px; padding: 0 24px;
  border-radius: 999px; font-size: 0.88rem; font-weight: 600;
  font-family: var(--font-body);
  text-decoration: none; cursor: pointer;
  transition: all 180ms ease; white-space: nowrap;
  border: 1px solid transparent; letter-spacing: 0.03em;
}
.btn svg { width: 15px; height: 15px; stroke-width: 2.4; }
.btn-primary {
  background: linear-gradient(135deg, rgba(26,95,170,0.92), rgba(11,58,114,0.96));
  color: #c8e0ff; border-color: rgba(100,175,255,0.3);
  box-shadow: 0 10px 28px rgba(0,50,130,0.3), inset 0 1px 0 rgba(255,255,255,0.07);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(0,70,170,0.38); }
.btn-ghost {
  background: var(--panel); color: var(--white);
  border-color: var(--border-accent); backdrop-filter: blur(8px);
}
.btn-ghost:hover { background: var(--panel-strong); transform: translateY(-2px); }

.status-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; margin-right: 7px; flex-shrink: 0;
}

/* ─── RAIL ─── */
.rail { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.rail-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--panel);
  backdrop-filter: blur(14px);
  cursor: pointer; transition: all 180ms ease; text-align: left;
}
.rail-btn:hover { border-color: var(--border-accent); background: var(--panel-strong); }
.rail-btn.active { border-color: rgba(100,175,255,0.5); background: rgba(58,158,255,0.15); }
.rail-swatch {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid rgba(255,255,255,0.22);
  background: linear-gradient(135deg, var(--sw-a), var(--sw-b));
}
.rail-name { font-size: 0.82rem; font-weight: 600; color: var(--white); display: block; }
.rail-meta { font-size: 0.72rem; color: var(--muted); display: block; margin-top: 1px; }

/* ─── DIALOG ─── */
dialog {
  width: min(940px,calc(100vw - 28px));
  max-height: min(700px,calc(100vh - 28px));
  padding: 0; border: 1px solid var(--border-accent);
  border-radius: var(--radius);
  background: rgba(8,18,38,0.97);
  color: var(--white);
  box-shadow: 0 40px 120px rgba(0,10,30,0.8);
  overflow: hidden; backdrop-filter: blur(30px);
}
dialog::backdrop { background: rgba(0,8,24,0.68); backdrop-filter: blur(12px); }
.dlg-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px; border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
}
.dlg-head h2 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.dlg-close {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer; transition: all 180ms;
}
.dlg-close:hover { background: rgba(255,255,255,0.08); color: var(--white); }
.dlg-close svg { width: 15px; height: 15px; stroke-width: 2.4; }
.dlg-body { overflow: auto; max-height: calc(min(700px,100vh - 28px) - 80px); }
table { width: 100%; min-width: 680px; border-collapse: collapse; }
th {
  padding: 11px 18px; text-align: left;
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: rgba(8,18,38,0.97);
}
td {
  padding: 13px 18px; border-bottom: 1px solid rgba(120,185,255,0.07);
  font-size: 0.87rem; color: var(--muted); vertical-align: top;
}
td strong { display: block; color: var(--white); font-weight: 600; font-size: 0.93rem; }
.td-price { color: var(--blue-light); font-weight: 700; font-size: 1rem; }

/* ─── RESPONSIVE ─── */
@media (max-width: 900px) {
  .content-zone { grid-template-columns: 1fr; }
  .glass-card:first-child { order: 2; }
  .main-copy { order: 1; }
  .glass-card:last-child { order: 3; }
}
@media (max-width: 640px) {
  .rail { grid-template-columns: 1fr 1fr; }
  .ctrl.prev { left: 4px; } .ctrl.next { right: 4px; }
  .slide[data-p="-1"],.slide[data-p="1"],.slide[data-p="-2"],.slide[data-p="2"] { opacity: 0; pointer-events: none; }
}
@media (max-width: 420px) { .rail { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
</head>

</dialog>

/* ─────────────────────────────────────────────────────
   IMAGES EMBARQUÉES EN BASE64
   Les images sont stockées directement dans le HTML —
   elles ne sont jamais chargées depuis un serveur externe
   et ne sont pas accessibles publiquement via une URL.

   WORKFLOW POUR AJOUTER TES IMAGES :
   1. Utilise l'outil "🖼 Intégrer mes images" en bas de page
      (visible uniquement si ?edit est dans l'URL, ou toujours
       si SHOW_EMBED_TOOL = true ci-dessous)
   2. Sélectionne Face + Dos pour chaque modèle
   3. Copie le code généré → colle-le dans frontImg / backImg
──────────────────────────────────────────────────────── */
const SHOW_EMBED_TOOL = true; /* passe à false pour masquer l'outil en prod */

const uploaded = {}; /* images converties en session (non persistées) */

/* ──────────────────────────────────────────
   PARTICLES DANS LES CARDS
────────────────────────────────────────── */
function cardParticles(canvas) {
  const ctx = canvas.getContext('2d');
  let W, H, dots = [], raf;
  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    W = canvas.width = r.width; H = canvas.height = r.height;
  }
  function mkDot() {
    return { x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.3+0.3,
      vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18,
      a: Math.random()*.45+.15 };
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<dots.length;i++) for(let j=i+1;j<dots.length;j++) {
      const dx=dots[i].x-dots[j].x, dy=dots[i].y-dots[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<85) {
        ctx.beginPath(); ctx.moveTo(dots[i].x,dots[i].y); ctx.lineTo(dots[j].x,dots[j].y);
        ctx.strokeStyle=`rgba(110,185,255,${.13*(1-d/85)})`; ctx.lineWidth=.5; ctx.stroke();
      }
    }
    dots.forEach(d => {
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(140,205,255,${d.a})`; ctx.fill();
      d.x+=d.vx; d.y+=d.vy;
      if(d.x<0||d.x>W) d.vx*=-1;
      if(d.y<0||d.y>H) d.vy*=-1;
    });
    raf=requestAnimationFrame(draw);
  }
  function init() { resize(); dots=Array.from({length:28},mkDot); draw(); }
  const ro=new ResizeObserver(()=>{cancelAnimationFrame(raf);init();});
  ro.observe(canvas.parentElement); init();
}
cardParticles(document.getElementById('cvSpec'));
cardParticles(document.getElementById('cvDispo'));

/* ──────────────────────────────────────────
   BUILD SLIDES
────────────────────────────────────────── */
let cur=0;
const stage=document.getElementById('stage');

function makeSlot(p,i,side) {
  const key=`${i}-${side}`;
  const src=uploaded[key]||(side==='front'?p.frontImg:p.backImg);
  const wrap=document.createElement('div');
  wrap.className=`phone-slot ${side}`;
  wrap.dataset.slot=key;
  if(src) {
    const img=document.createElement('img');
    img.src=src; img.alt=`${p.name} ${side}`; img.draggable=false;
    img.onerror=()=>{wrap.innerHTML=shellHtml(p);};
    wrap.appendChild(img);
  } else {
    wrap.innerHTML=shellHtml(p);
  }
  return wrap;
}
function shellHtml(p) {
  return `<div class="phone-shell" style="--ca:${p.colorA};--cb:${p.colorB}"></div>`;
}
function makeUploadBtn(i,side,label) {
  const lbl=document.createElement('label');
  lbl.className='upload-btn';
  const icon=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`;
  lbl.innerHTML=`${icon}${label}<input type="file" accept="image/*">`;
  lbl.querySelector('input').addEventListener('change',function(){
    const file=this.files[0]; if(!file) return;
    const fr=new FileReader();
    fr.onload=e=>{
      const key=`${i}-${side}`;
      uploaded[key]=e.target.result;
      document.querySelectorAll(`.phone-slot[data-slot="${key}"]`).forEach(slot=>{
        slot.innerHTML='';
        const img=document.createElement('img');
        img.src=e.target.result; img.alt=products[i].name; img.draggable=false;
        slot.appendChild(img);
      });
    };
    fr.readAsDataURL(file);
  });
  return lbl;
}

products.forEach((p,i)=>{
  const slide=document.createElement('button');
  slide.type='button'; slide.className='slide'; slide.dataset.index=i;
  slide.setAttribute('aria-label',`Voir ${p.name}`);

  const duo=document.createElement('div');
  duo.className='phone-duo';
  duo.appendChild(makeSlot(p,i,'front'));
  duo.appendChild(makeSlot(p,i,'back'));
  slide.appendChild(duo);

  slide.addEventListener('click',e=>{
    if(i!==cur){cur=i;update();}
  });
  stage.appendChild(slide);
});

/* ──────────────────────────────────────────
   RAIL
────────────────────────────────────────── */
const rail=document.getElementById('rail');
products.forEach((p,i)=>{
  const btn=document.createElement('button');
  btn.type='button'; btn.className='rail-btn';
  btn.innerHTML=`<span class="rail-swatch" style="--sw-a:${p.swA};--sw-b:${p.swB}"></span><span><span class="rail-name">${p.name}</span><span class="rail-meta">${p.colorLabel} · ${p.price}</span></span>`;
  btn.addEventListener('click',()=>{cur=i;update();});
  rail.appendChild(btn);
});

/* ──────────────────────────────────────────
   COMPARE
────────────────────────────────────────── */
document.getElementById('cmpBody').innerHTML=products.map(p=>`
  <tr>
    <td><strong>${p.name}</strong>${p.colorLabel}</td>
    <td><span class="td-price">${p.price}</span></td>
    <td>${p.battery}</td><td>${p.chip}</td><td>${p.storage}</td>
    <td>${p.warranty}</td><td>${p.pickup}</td>
  </tr>`).join('');

/* ──────────────────────────────────────────
   UPDATE
────────────────────────────────────────── */
function offset(i){
  let d=i-cur; const h=Math.floor(products.length/2);
  if(d>h) d-=products.length; if(d<-h) d+=products.length;
  return Math.max(-2,Math.min(2,d));
}
function update(){
  const p=products[cur];
  document.querySelectorAll('.slide').forEach((s,i)=>{
    s.dataset.p=offset(i);
    s.setAttribute('aria-current',i===cur?'true':'false');
  });
  document.querySelectorAll('.rail-btn').forEach((b,i)=>b.classList.toggle('active',i===cur));

  document.getElementById('prodName').textContent=p.name;
  document.getElementById('prodPrice').textContent=p.price;
  document.getElementById('prodDesc').textContent=p.desc;

  document.getElementById('specList').innerHTML=[
    ['Batterie',p.battery],['Puce',p.chip],['Stockage',p.storage],['Garantie',p.warranty]
  ].map(([l,v])=>`<div class="spec-row"><span>${l}</span><strong>${v}</strong></div>`).join('');

  const sc=p.stock==='En stock'?'var(--success)':'var(--warn)';
  const sc2=p.stock==='En stock'?'rgba(61,255,160,0.15)':'rgba(255,180,67,0.15)';
  document.getElementById('dispoList').innerHTML=[
    ['Stock',`<span style="display:flex;align-items:center"><span class="status-dot" style="background:${sc};box-shadow:0 0 0 4px ${sc2}"></span>${p.stock}</span>`],
    ['Réservation',p.reservation],['Retrait',p.pickup]
  ].map(([l,v])=>`<div class="spec-row"><span>${l}</span><strong>${v}</strong></div>`).join('');

  document.getElementById('pillList').innerHTML=p.pills.map(t=>`<span class="pill">${t}</span>`).join('');

  const mc=document.getElementById('mainCopy');
  mc.style.animation='none'; void mc.offsetWidth;
  mc.style.animation='fadeUp 380ms cubic-bezier(0.22,1,0.36,1) both';
}

/* ──────────────────────────────────────────
   EVENTS
────────────────────────────────────────── */
function move(d){cur=(cur+d+products.length)%products.length;update();}
document.getElementById('prev').addEventListener('click',()=>move(-1));
document.getElementById('next').addEventListener('click',()=>move(1));

const dlg=document.getElementById('dlg');
document.getElementById('compareBtn').addEventListener('click',()=>dlg.showModal?.()??dlg.setAttribute('open',''));
document.getElementById('dlgClose').addEventListener('click',()=>dlg.close());
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});
let tx=0;
stage.addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)move(d>0?-1:1);},{passive:true});

update();
</script>
</body>
